default_stages: [pre-push]

repos:
  - repo: local
    hooks:

      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check
        language: system
        types: [python]

      - id: pytest
        name: pytest
        entry: sh -c 'DB_PATH="${DB_PATH:-test.db}" uv run pytest'
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy app/
        language: system
        pass_filenames: false