services:
  db:
    image: postgres:17-alpine
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}"]
      start_period: 30s
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_ENGINE: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    develop:
      watch:
        - path: ./app
          action: sync
          target: /app/app

        - path: ./alembic
          action: sync
          target: /app/alembic

        - path: ./alembic.ini
          action: sync
          target: /app/alembic.ini

        - path: pyproject.toml
          action: rebuild

        - path: uv.lock
          action: rebuild

volumes:
  pgdata:
