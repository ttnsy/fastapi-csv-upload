[project]
name = "fastapi-csv-upload"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.2",
    "fastapi[standard]>=0.115.12",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=22.0.0",
    "pydantic-settings>=2.8.1",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.3.250308",
    "pre-commit>=4.5.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-env>=1.1.5",
    "ruff>=0.14.9",
]

[tool.pytest.ini_options]
addopts = ["-vvs"]
env = [
    "DATABASE_URL=sqlite:///test.db",
]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.csv", "pyarrow.parquet"]
ignore_missing_imports = true

[tool.ruff]
exclude = [".venv", "uv.lock"]

[tool.mypy]
plugins = ["pydantic.mypy"]